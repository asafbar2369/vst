name: VICE SYNTH X - Windows build and validation
on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/vice-synth-x-*'
      - 'claude/bold-cori-kvu779'
    paths:
      - 'ViceSynthX/**'
      - '.github/workflows/vice-synth-x-windows.yml'
  pull_request:
    branches:
      - 'claude/bold-cori-kvu779'
    paths:
      - 'ViceSynthX/**'
      - '.github/workflows/vice-synth-x-windows.yml'

permissions:
  contents: read

concurrency:
  group: vsx-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4
  VST3SDK_TAG: v3.8.1_build_84

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compilation units
        run: python3 ViceSynthX/tools/verify_sources.py

  core-dsp-and-ai:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure independent core tests
        run: cmake -S ViceSynthX -B build-vsx-core -A x64 -DVSX_CORE_ONLY=ON
      - name: Compile engine and AI tests
        run: cmake --build build-vsx-core --config Release --parallel 4 --target ViceSynthXCoreTests
      - name: Run core regression tests
        shell: pwsh
        run: |
          $test = Get-ChildItem build-vsx-core -Recurse -File -Filter 'ViceSynthXCoreTests.exe' | Select-Object -First 1
          if (-not $test) { throw 'Core test runner missing' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed with exit code $LASTEXITCODE" }

  windows-release:
    needs: source-audit
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path ViceSynthX/CMakeLists.txt -Pattern 'project\(ViceSynthX VERSION ([0-9.]+)'
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path logs -Force | Out-Null
          "commit=${{ github.sha }}" | Set-Content logs/BUILD_INFO.txt
          "runner=$env:ImageOS $env:ImageVersion" | Add-Content logs/BUILD_INFO.txt
          "date=$(Get-Date -Format o)" | Add-Content logs/BUILD_INFO.txt

      - name: Configure VICE SYNTH X
        run: cmake -S ViceSynthX -B build-vsx -A x64 -DVSX_BUILD_TESTS=ON

      - name: Build VST3, standalone and test runner
        shell: pwsh
        run: |
          cmake --build build-vsx --config Release --parallel 4 --target ViceSynthX_VST3 ViceSynthX_Standalone ViceSynthXTests 2>&1 | Tee-Object -FilePath logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run automated tests (engine, AI validation, presets, editor)
        shell: pwsh
        run: |
          $test = Get-ChildItem build-vsx -Recurse -File -Filter 'ViceSynthXTests.exe' | Select-Object -First 1
          if (-not $test) { throw 'Test runner missing' }
          $env:VSX_SCREENSHOT_DIR = "$PWD/logs/screenshots"
          $env:VSX_AUDIO_DIR = "$PWD/logs/audio"
          & $test.FullName 2>&1 | Tee-Object -FilePath logs/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage build outputs
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build-vsx -Recurse -Directory -Filter 'VICE SYNTH X.vst3' | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          $standalone = Get-ChildItem build-vsx -Recurse -File -Filter 'VICE SYNTH X.exe' | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $plugin -or -not $standalone) { throw 'Required build outputs missing' }
          New-Item -ItemType Directory -Path stage, stage/docs, dist -Force | Out-Null
          Copy-Item $plugin.FullName stage/ -Recurse
          Copy-Item $standalone.FullName stage/
          Get-ChildItem ViceSynthX/docs -File -Filter '*.md' -ErrorAction SilentlyContinue | Copy-Item -Destination stage/docs

      - name: pluginval (strictness 10)
        id: pluginval
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $validator = Get-ChildItem pluginval -Recurse -File -Filter 'pluginval.exe' | Select-Object -First 1
          if (-not $validator) { throw 'pluginval executable missing' }
          & $validator.FullName --strictness-level 10 --timeout-ms 900000 --output-dir "$PWD/logs/pluginval" --validate "$PWD/stage/VICE SYNTH X.vst3" 2>&1 | Tee-Object -FilePath logs/pluginval.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Steinberg VST3 validator
        id: sdk
        continue-on-error: true
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:VST3SDK_TAG --recursive --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S vst3sdk -B build-sdk -A x64 -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_CREATE_PLUGIN_LINK=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-sdk --config Release --target validator --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Steinberg VST3 validator
        id: vst3validator
        if: steps.sdk.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $v = Get-ChildItem build-sdk -Recurse -File -Filter 'validator.exe' | Select-Object -First 1
          if (-not $v) { throw 'validator.exe missing' }
          & $v.FullName "$PWD/stage/VICE SYNTH X.vst3" 2>&1 | Tee-Object -FilePath logs/vst3-validator.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler not available' }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DStageDir=$PWD\stage" "/DOutputDir=$PWD\dist" ViceSynthX\installer\ViceSynthX.iss 2>&1 | Tee-Object -FilePath logs/installer-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify silent install and uninstall
        id: installtest
        continue-on-error: true
        shell: pwsh
        run: |
          $logDir = (Resolve-Path logs).Path
          $setup = Get-ChildItem dist -File -Filter 'VICE-SYNTH-X-Setup-*.exe' | Select-Object -First 1
          $vst3 = "$env:CommonProgramFiles\VST3\VICE SYNTH X.vst3"
          $exe = "$env:ProgramFiles\VICE SYNTH X\VICE SYNTH X.exe"
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=`"$logDir\install.log`"" -Wait -PassThru
          "installer exit code: $($p.ExitCode)" | Tee-Object -FilePath logs/install-test.log
          $okInstall = (Test-Path $vst3) -and (Test-Path $exe)
          "installed VST3: $(Test-Path $vst3)  standalone: $(Test-Path $exe)" | Tee-Object -FilePath logs/install-test.log -Append
          $unins = Get-ChildItem "$env:ProgramFiles\VICE SYNTH X" -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $unins) { throw 'uninstaller missing' }
          $u = Start-Process $unins.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=`"$logDir\uninstall.log`"" -Wait -PassThru
          # the Inno Setup uninstaller re-launches itself from a temporary copy: wait for the files to go
          for ($i = 0; $i -lt 60 -and ((Test-Path $vst3) -or (Test-Path $exe)); $i++) { Start-Sleep -Seconds 1 }
          "uninstaller exit code: $($u.ExitCode)" | Tee-Object -FilePath logs/install-test.log -Append
          $okUninstall = -not (Test-Path $vst3) -and -not (Test-Path $exe)
          "removed VST3 and standalone: $okUninstall" | Tee-Object -FilePath logs/install-test.log -Append
          if (Test-Path "$logDir\uninstall.log") { Get-Content "$logDir\uninstall.log" | Select-Object -Last 15 }
          if (-not ($okInstall -and $okUninstall -and $p.ExitCode -eq 0 -and $u.ExitCode -eq 0)) { exit 1 }

      - name: Package Windows artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          if (Test-Path "stage/VICE SYNTH X.vst3") { Compress-Archive -Path "stage/VICE SYNTH X.vst3" -DestinationPath dist/VICE-SYNTH-X-VST3-Windows-x64.zip -Force }
          if (Test-Path "stage/VICE SYNTH X.exe") { Copy-Item "stage/VICE SYNTH X.exe" dist/ }
          $summary = @(
            "pluginval (strictness 10): ${{ steps.pluginval.outcome }}",
            "VST3 SDK validator build: ${{ steps.sdk.outcome }}",
            "Steinberg VST3 validator: ${{ steps.vst3validator.outcome }}",
            "Silent install/uninstall: ${{ steps.installtest.outcome }}")
          $summary | Set-Content logs/VALIDATION_SUMMARY.txt
          $summary | ForEach-Object { "- $_" } | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VICE-SYNTH-X-Windows-x64
          path: dist/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VICE-SYNTH-X-validation-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Print validation report
        if: always()
        shell: pwsh
        run: |
          Write-Host "===== TEST SUMMARY ====="
          if (Test-Path logs/tests.log) { Select-String -Path logs/tests.log -Pattern 'VICE SYNTH X:|!!! Test|FAILED' | Select-Object -Last 20 | ForEach-Object { $_.Line } }
          Write-Host "===== PLUGINVAL (strictness 10) ====="
          if (Test-Path logs/pluginval.log) {
            $pv = Get-Content logs/pluginval.log
            "lines: $($pv.Count)"
            $pv | Select-String -Pattern 'Starting tests in|ALL TESTS|SUCCESS|FAILED|failed|Validation' | Select-Object -First 80 | ForEach-Object { $_.Line }
            $pv | Select-Object -Last 8
          }
          Write-Host "===== STEINBERG VST3 VALIDATOR ====="
          if (Test-Path logs/vst3-validator.log) { Get-Content logs/vst3-validator.log | Select-String -Pattern 'Result|tests|passed|failed|Error' | Select-Object -Last 20 | ForEach-Object { $_.Line } }
          Write-Host "===== INSTALL TEST ====="
          if (Test-Path logs/install-test.log) { Get-Content logs/install-test.log }
          Write-Host "===== SHA-256 ====="
          if (Test-Path dist/SHA256SUMS.txt) { Get-Content dist/SHA256SUMS.txt }
          Write-Host "===== SUMMARY ====="
          if (Test-Path logs/VALIDATION_SUMMARY.txt) { Get-Content logs/VALIDATION_SUMMARY.txt }

      - name: Fail if any validation failed
        if: steps.pluginval.outcome != 'success' || steps.vst3validator.outcome != 'success' || steps.installtest.outcome != 'success'
        shell: pwsh
        run: |
          Get-Content logs/VALIDATION_SUMMARY.txt
          throw 'One or more validation steps failed (see VICE-SYNTH-X-validation-logs).'
