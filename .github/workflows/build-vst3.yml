name: Build RMX16 VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target RMX16_Reconstruction_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMX16-VST3-Windows-x64
          path: build/**/VST3/*.vst3
          if-no-files-found: error
          retention-days: 14

# Trigger build
