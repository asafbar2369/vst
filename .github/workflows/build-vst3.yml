name: Build RMX16 VST3

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Run source regression checks
        run: python3 tools/verify_source.py

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target RMX16_Reconstruction_VST3

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval
          $validator = Get-ChildItem -Path pluginval -Filter pluginval.exe -Recurse | Select-Object -First 1
          if (-not $validator) { throw "pluginval.exe was not found in the release archive" }
          $plugin = Get-ChildItem -Path build -Filter "*.vst3" -Directory -Recurse | Select-Object -First 1
          if (-not $plugin) { throw "Built VST3 bundle was not found" }
          & $validator.FullName --strictness-level 5 --validate $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter "*.vst3" -Directory -Recurse | Select-Object -First 1
          if (-not $plugin) { throw "Built VST3 bundle was not found" }
          Compress-Archive -Path $plugin.FullName -DestinationPath RMX16-VST3-Windows-x64.zip -Force

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: RMX16-VST3-Windows-x64
          path: RMX16-VST3-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
