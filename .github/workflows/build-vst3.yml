name: Build RMX16 VST3 and Standalone

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Run source regression checks
        run: python3 tools/verify_source.py

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target RMX16_Reconstruction_VST3

      - name: Build Standalone
        run: cmake --build build --config Release --target RMX16_Reconstruction_Standalone

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: RMX16-VST3-Windows-x64
          path: build/**/VST3/*.vst3
          if-no-files-found: error
          retention-days: 14

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: RMX16-Standalone-Windows-x64
          path: build/**/Standalone/*.exe
          if-no-files-found: error
          retention-days: 14
