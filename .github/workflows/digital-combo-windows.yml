name: Digital Combo - Windows VST3 build and validation

on:
  workflow_dispatch:
  push:
    branches: [ 'claude/**', main ]
    paths:
      - 'roland-digital-combo/**'
      - '.github/workflows/digital-combo-windows.yml'
  pull_request:
    paths:
      - 'roland-digital-combo/**'
      - '.github/workflows/digital-combo-windows.yml'

permissions:
  contents: read

env:
  VST3SDK_TAG: v3.8.0_build_66        # MIT licensed Steinberg SDK, used only to build validator.exe
  PLUGINVAL_VERSION: v1.0.4           # GPLv3 tool, downloaded and run only, never linked or shipped
  BUNDLE: build/DigitalCombo_artefacts/Release/VST3/Digital Combo.vst3

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record build environment
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $info = @()
          $info += "Runner image: $env:ImageOS $env:ImageVersion"
          $info += (Get-CimInstance Win32_OperatingSystem | Select-Object -ExpandProperty Caption)
          $info += (cmake --version | Select-Object -First 1)
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion
          $info += "Visual Studio $vs"
          $info += "Commit $env:GITHUB_SHA"
          $info | Tee-Object -FilePath logs/environment.txt

      - name: Configure (JUCE 9.0.5 pinned)
        run: |
          cmake -S roland-digital-combo -B build -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object -FilePath logs/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build VST3 and test program (Release, x64)
        run: |
          cmake --build build --config Release --target DigitalCombo_VST3 DigitalComboTests DigitalComboHostTest --parallel 2>&1 | Tee-Object -FilePath logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $warn = Select-String -Path logs/build.log -Pattern 'roland-digital-combo.*warning' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          "Project warnings (excluding JUCE): $(@($warn).Count)" | Tee-Object -FilePath logs/build-summary.txt
          $warn | Tee-Object -FilePath logs/build-summary.txt -Append

      - name: Inspect VST3 bundle structure and binary
        run: |
          $bundle = "$env:BUNDLE"
          if (-not (Test-Path $bundle)) { throw "VST3 bundle missing: $bundle" }
          Get-ChildItem -Recurse $bundle | ForEach-Object { "{0,12}  {1}" -f $_.Length, $_.FullName.Substring((Resolve-Path $bundle).Path.Length) } | Tee-Object -FilePath logs/bundle.txt
          $dll = Join-Path $bundle "Contents/x86_64-win/Digital Combo.vst3"
          if (-not (Test-Path $dll)) { throw "Missing Contents/x86_64-win/Digital Combo.vst3" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $dll))
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          "PE machine type: 0x{0:X4} (0x8664 = x64)" -f $machine | Tee-Object -FilePath logs/bundle.txt -Append
          if ($machine -ne 0x8664) { throw "Binary is not x64" }
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash
          "SHA256 $hash" | Tee-Object -FilePath logs/bundle.txt -Append
          $mi = Join-Path $bundle "Contents/Resources/moduleinfo.json"
          if (Test-Path $mi) { Get-Content $mi | Tee-Object -FilePath logs/moduleinfo.json } else { "moduleinfo.json not present" | Tee-Object -FilePath logs/bundle.txt -Append }

      - name: Check DLL dependencies (must not need the Visual C++ Redistributable)
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $dll = Join-Path "$env:BUNDLE" "Contents/x86_64-win/Digital Combo.vst3"
          & $dumpbin /nologo /dependents "$dll" 2>&1 | Tee-Object -FilePath logs/dependencies.txt
          $deps = Select-String -Path logs/dependencies.txt -Pattern '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value.ToUpper() }
          "Imported DLLs: $($deps -join ', ')" | Tee-Object -FilePath logs/bundle.txt -Append
          $bad = $deps | Where-Object { $_ -match '^(MSVCP|VCRUNTIME|CONCRT|VCOMP|UCRTBASED|API-MS-WIN-CRT-)' }
          if ($bad) { throw "Plug-in still depends on the Visual C++ runtime: $($bad -join ', ')" }
          "OK: no Visual C++ runtime DLLs imported (static /MT runtime)" | Tee-Object -FilePath logs/bundle.txt -Append

      - name: Run automated tests
        run: |
          & build/DigitalComboTests_artefacts/Release/DigitalComboTests.exe logs/screenshots 2>&1 | Tee-Object -FilePath logs/tests.log
          $code = $LASTEXITCODE
          "Test exit code: $code"
          if ($code -ne 0) { exit $code }

      - name: Host test (load the compiled VST3 like a DAW, record WAV demos)
        run: |
          & build/DigitalComboHostTest_artefacts/Release/DigitalComboHostTest.exe "$env:BUNDLE" logs/audio-demos 2>&1 | Tee-Object -FilePath logs/host-test.log
          $code = $LASTEXITCODE
          "Host test exit code: $code"
          if ($code -ne 0) { exit $code }

      - name: Build Steinberg VST3 validator
        run: |
          git clone --depth 1 --branch $env:VST3SDK_TAG https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          cmake -S vst3sdk -B vst3build -G "Visual Studio 17 2022" -A x64 -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_RUN_VST_VALIDATOR=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build vst3build --config Release --target validator --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Steinberg VST3 validator
        run: |
          $v = Get-ChildItem -Recurse vst3build -Filter validator.exe | Select-Object -First 1
          if (-not $v) { throw "validator.exe not built" }
          & $v.FullName "$env:BUNDLE" 2>&1 | Tee-Object -FilePath logs/vst3-validator.log
          $code = $LASTEXITCODE
          Select-String -Path logs/vst3-validator.log -Pattern 'Result:'
          "Validator exit code: $code"
          if ($code -ne 0) { exit $code }

      - name: Cache pluginval download
        uses: actions/cache@v4
        with:
          path: pluginval.zip
          key: pluginval-${{ env.PLUGINVAL_VERSION }}-windows

      - name: Run pluginval (strictness 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs 2 and 3 failed only because github.com answered 504 for the release download.
          # Try the cached file, the GitHub API (gh), then the direct URL.
          $url = "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip"
          for ($try = 1; $try -le 6 -and -not (Test-Path pluginval.zip); $try++) {
            if ($try % 2 -eq 1) { gh release download $env:PLUGINVAL_VERSION --repo Tracktion/pluginval --pattern pluginval_Windows.zip --clobber 2>&1 | Out-Host }
            else { try { Invoke-WebRequest -Uri $url -OutFile pluginval.zip } catch { "Direct download failed: $($_.Exception.Message)" } }
            if ((Test-Path pluginval.zip) -and (Get-Item pluginval.zip).Length -lt 100000) { Remove-Item pluginval.zip } # partial file
            if (-not (Test-Path pluginval.zip)) { "Download attempt $try failed"; Start-Sleep -Seconds (10 * $try) }
          }
          if (-not (Test-Path pluginval.zip)) { throw "pluginval could not be downloaded" }
          "pluginval.zip SHA256: $((Get-FileHash pluginval.zip -Algorithm SHA256).Hash)"
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval -Force
          $pv = Get-ChildItem -Recurse pluginval -Filter pluginval.exe | Select-Object -First 1
          & $pv.FullName --strictness-level 10 --validate-in-process --output-dir logs/pluginval --validate "$env:BUNDLE" 2>&1 | Tee-Object -FilePath logs/pluginval.log
          $code = $LASTEXITCODE
          "pluginval exit code: $code"
          if ($code -ne 0) { exit $code }

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Host }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          $bundle = (Resolve-Path "$env:BUNDLE").Path
          & $iscc "/DBundleDir=$bundle" "/DAppVersion=0.1.0" "/O$PWD\installer-out" roland-digital-combo/installer/DigitalCombo.iss 2>&1 | Tee-Object -FilePath logs/installer-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer-out | Format-Table Name, Length | Out-String | Tee-Object -FilePath logs/installer-build.log -Append

      - name: Installer test (silent install, check files, validate installed copy, silent uninstall)
        run: |
          $setup = Get-ChildItem installer-out -Filter *.exe | Select-Object -First 1
          $target = "$env:CommonProgramFiles\VST3\Digital Combo.vst3"
          $log = "logs/installer-test.log"
          "Installer: $($setup.Name), SHA256 $((Get-FileHash $setup.FullName -Algorithm SHA256).Hash)" | Tee-Object -FilePath $log
          if (Test-Path $target) { throw "$target already exists before the test" }
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$PWD\logs\installer-install-inno.log" -Wait -PassThru
          "Install exit code: $($p.ExitCode)" | Tee-Object -FilePath $log -Append
          if ($p.ExitCode -ne 0) { throw "install failed" }
          $built = Join-Path "$env:BUNDLE" "Contents/x86_64-win/Digital Combo.vst3"
          $installed = Join-Path $target "Contents\x86_64-win\Digital Combo.vst3"
          if (-not (Test-Path $installed)) { throw "installed binary missing: $installed" }
          $h1 = (Get-FileHash $built -Algorithm SHA256).Hash; $h2 = (Get-FileHash $installed -Algorithm SHA256).Hash
          "Built SHA256     $h1" | Tee-Object -FilePath $log -Append
          "Installed SHA256 $h2" | Tee-Object -FilePath $log -Append
          if ($h1 -ne $h2) { throw "installed binary differs from the built one" }
          Get-ChildItem -Recurse $target | ForEach-Object { "  " + $_.FullName } | Tee-Object -FilePath $log -Append
          $v = Get-ChildItem -Recurse vst3build -Filter validator.exe | Select-Object -First 1
          & $v.FullName "$target" 2>&1 | Tee-Object -FilePath logs/vst3-validator-installed.log | Select-String 'Result:' | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "validator failed on the installed copy" }
          "Validator on installed copy: exit 0" | Tee-Object -FilePath $log -Append
          $uninst = "$env:ProgramFiles\Digital Combo\unins000.exe"
          if (-not (Test-Path $uninst)) { throw "uninstaller missing: $uninst" }
          $u = Start-Process -FilePath $uninst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          "Uninstall exit code: $($u.ExitCode)" | Tee-Object -FilePath $log -Append
          for ($i = 0; $i -lt 30 -and (Test-Path $target); $i++) { Start-Sleep -Seconds 1 } # uninstaller finishes in a helper process
          if (Test-Path $target) { throw "plug-in still present after uninstall" }
          "OK: installed, validated and removed cleanly" | Tee-Object -FilePath $log -Append

      - name: Package VST3 for download
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "$env:BUNDLE" "package/Digital Combo.vst3"
          Copy-Item roland-digital-combo/INSTALL-WINDOWS.txt package/
          Copy-Item installer-out/*.exe package/
          Copy-Item -Recurse logs package/test-logs
          Compress-Archive -Path package/* -DestinationPath DigitalCombo-VST3-Windows-x64.zip -Force
          Get-FileHash DigitalCombo-VST3-Windows-x64.zip -Algorithm SHA256 | Format-List

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCombo-VST3-Windows-x64
          path: DigitalCombo-VST3-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCombo-Setup-Windows-x64
          path: installer-out/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Verification summary (always)
        if: always()
        run: |
          $lines = @("## Digital Combo verification summary", "")
          foreach ($f in @('logs/environment.txt', 'logs/build-summary.txt', 'logs/bundle.txt')) {
            if (Test-Path $f) { $lines += "### $f"; $lines += '```'; $lines += Get-Content $f; $lines += '```' }
          }
          if (Test-Path logs/tests.log) {
            $lines += "### automated tests (FAIL lines + result)"; $lines += '```'
            $lines += Select-String -Path logs/tests.log -Pattern '^FAIL|RESULT:|CPU load|real time' | ForEach-Object { $_.Line }
            $lines += '```'
          }
          if (Test-Path logs/host-test.log) { $lines += "### host test (compiled VST3 loaded through JUCE's VST3 host)"; $lines += '```'; $lines += Get-Content logs/host-test.log | Where-Object { $_ -match '^(PASS|FAIL)|RESULT' }; $lines += '```' }
          if (Test-Path logs/vst3-validator.log) { $lines += "### Steinberg VST3 validator"; $lines += '```'; $lines += Select-String -Path logs/vst3-validator.log -Pattern 'Result:|\[Failed\]' | ForEach-Object { $_.Line }; $lines += '```' }
          if (Test-Path logs/installer-test.log) { $lines += "### installer test"; $lines += '```'; $lines += Get-Content logs/installer-test.log; $lines += '```' }
          if (Test-Path logs/pluginval.log) { $lines += "### pluginval"; $lines += '```'; $lines += Select-String -Path logs/pluginval.log -Pattern 'Strictness level|!!!|FAILED|SUCCESS' | ForEach-Object { $_.Line }; $lines += '```' }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $lines | ForEach-Object { Write-Output $_ }

      - name: Upload logs (always, also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCombo-test-logs
          path: logs
          retention-days: 90
